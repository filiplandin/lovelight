name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests scripts
      - run: for f in src/lovelight/static/*.js; do node --check "$f"; done
      # Live Claude tests skip automatically: no ANTHROPIC_API_KEY in CI.
      - run: uv run pytest tests/ -q
        env:
          GMAIL_USER: ""
