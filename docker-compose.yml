# Local / single-host deployment. `docker compose up --build` → http://localhost:8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env  # runtime only, never baked into the image; optional
        required: false
    environment:
      LOVELIGHT_DB: /data/lovelight.db
    volumes:
      - lovelight-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Roadmap; the app uses SQLite today and does not connect to this service.
  # Opt in with `docker compose --profile postgres up`.
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: lovelight
      POSTGRES_USER: lovelight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovelight -d lovelight"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lovelight-data:
  postgres-data:
