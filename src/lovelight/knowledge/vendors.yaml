    aliases: ["microsoft 365", "office 365"]
    bank_patterns: ["msft", "microsoft 365"]
    vendor_profile: Office and collaboration software subscriptions.
    activity: software_subscription
    notes: Azure hosting is it_services; add a separate entry if the client uses it.

  - id: google-workspace
