<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovelight — AI bookkeeping for bureaus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%238b6cff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-glow"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span></span></div>
      <div>
        <div class="brand-name">Lovelight</div>
        <div class="brand-sub">AI bookkeeping</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <section id="pipeStats" class="pipe-stats" aria-label="Pipeline stats" hidden></section>
    <div class="tagline">
      <div class="tl-row"><i class="dot violet"></i>AI proposes</div>
      <div class="tl-row"><i class="dot cyan"></i>code disposes</div>
      <div class="tl-row"><i class="dot green"></i>accountant approves</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="client-switch" id="clientSwitch"></div>
      <div class="live"><span class="pulse"></span>Live</div>
      <div id="healthPill" class="health-pill" hidden></div>
      <button class="btn sm ghost tour-btn" data-act="tour" title="Guided tour (space pause, arrow next)">Tour</button>
      <div class="stats" id="stats"></div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="drawer" class="drawer" aria-hidden="true"></div>
<div id="scrim" class="scrim"></div>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts"></div>
<script src="mock.js"></script>
<script src="app.js"></script>
<script src="tour.js"></script>
</body>
</html>
